<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon tableau de bord — Carti</title>
<style>
  :root {
    --bg: #0D0D0F;
    --bg-secondary: #1A1A1D;
    --gold: #C9A34D;
    --gold-hover: #E0BC6E;
    --text: #F5F2EC;
    --text-secondary: #A0A0A5;
    --border: #2A2A2E;
    --error: #E5484D;
    --success: #3FAE5D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .logo { font-size: 22px; font-weight: 700; color: var(--gold); }
  .logout { color: var(--text-secondary); font-size: 13px; cursor: pointer; }
  .card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h2 { font-size: 16px; margin-bottom: 14px; color: var(--text); }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 13px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--gold); }
  textarea { resize: vertical; min-height: 70px; }
  button {
    width: 100%;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 18px;
  }
  button:active { background: var(--gold-hover); }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
  }
  .status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-published { background: rgba(63,174,93,0.15); color: var(--success); }
  .status-draft { background: rgba(160,160,165,0.15); color: var(--text-secondary); }
  .link-preview {
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    color: var(--gold);
    word-break: break-all;
    margin-top: 10px;
  }
  .link-preview a { color: var(--gold); text-decoration: underline; }
  .message {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    display: none;
  }
  .message.error { display: block; background: rgba(229,72,77,0.15); color: var(--error); }
  .message.success { display: block; background: rgba(63,174,93,0.15); color: var(--success); }
  .loading { text-align: center; color: var(--text-secondary); padding: 40px; }
</style>
</head>
<body>

  <div class="header">
    <div class="logo">Carti</div>
    <div class="logout" onclick="logout()">Déconnexion</div>
  </div>

  <div id="loading" class="loading">Chargement...</div>

  <div id="content" style="display:none">

    <div class="card">
      <h2>Ma carte <span id="status-badge" class="status-badge status-draft">Brouillon</span></h2>

      <label>Nom complet *</label>
      <input type="text" id="full_name" placeholder="Nicole Houansou">

      <label>Poste / Métier</label>
      <input type="text" id="job_title" placeholder="Fondatrice">

      <label>Entreprise</label>
      <input type="text" id="company_name" placeholder="Irex Digital">

      <label>Bio</label>
      <textarea id="bio" placeholder="Je transforme vos idées en présence digitale."></textarea>

      <label>Téléphone</label>
      <input type="tel" id="phone" placeholder="+229 ...">

      <label>WhatsApp</label>
      <input type="tel" id="whatsapp" placeholder="+229 ...">

      <label>Email</label>
      <input type="email" id="email" placeholder="contact@...">

      <label>Site web</label>
      <input type="url" id="website" placeholder="https://...">

      <label>Adresse</label>
      <input type="text" id="address" placeholder="Parakou, Bénin">

      <label>Lien personnalisé (slug) *</label>
      <input type="text" id="slug" placeholder="nicole" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'')">
      <div class="link-preview" id="link-preview">https://coco98-ff.github.io/Carti/card.html?slug=votre-lien</div>

      <button onclick="saveCard()">Enregistrer</button>
      <button class="btn-secondary" onclick="togglePublish()" id="publish-btn">Publier ma carte</button>
    </div>

    <div id="message" class="message"></div>

  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://arjzcloshiqucpyqbotl.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyanpjbG9zaGlxdWNweXFib3RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MjY1NzYsImV4cCI6MjEwMDMwMjU3Nn0.89gB9o1pqIv5G5nwPOpYqz6SrnK38AHTE8Ax7T3-OrE'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    let currentUser = null
    let currentCardId = null

    async function init() {
      const { data: { user } } = await supabase.auth.getUser()
      if (!user) {
        window.location.href = 'index.html'
        return
      }
      currentUser = user

      const { data: cards } = await supabase
        .from('digital_cards')
        .select('*')
        .eq('owner_user_id', user.id)
        .limit(1)

      if (cards && cards.length > 0) {
        const card = cards[0]
        currentCardId = card.id
        document.getElementById('full_name').value = card.full_name || ''
        document.getElementById('job_title').value = card.job_title || ''
        document.getElementById('company_name').value = card.company_name || ''
        document.getElementById('bio').value = card.bio || ''
        document.getElementById('phone').value = card.phone || ''
        document.getElementById('whatsapp').value = card.whatsapp || ''
        document.getElementById('email').value = card.email || ''
        document.getElementById('website').value = card.website || ''
        document.getElementById('address').value = card.address || ''
        document.getElementById('slug').value = card.slug || ''
        updatePublishUI(card.is_published)
        updateLinkPreview()
      } else {
        document.getElementById('full_name').value = user.user_metadata?.full_name || ''
      }

      document.getElementById('slug').addEventListener('input', updateLinkPreview)
      document.getElementById('loading').style.display = 'none'
      document.getElementById('content').style.display = 'block'
    }

    function updateLinkPreview() {
      const slug = document.getElementById('slug').value || 'votre-lien'
      const fullLink = 'https://coco98-ff.github.io/Carti/card.html?slug=' + slug
      document.getElementById('link-preview').innerHTML = '<a href="' + fullLink + '" target="_blank">' + fullLink + '</a>'
    }

    function updatePublishUI(isPublished) {
      const badge = document.getElementById('status-badge')
      const btn = document.getElementById('publish-btn')
      if (isPublished) {
        badge.textContent = 'Publiée'
        badge.className = 'status-badge status-published'
        btn.textContent = 'Dépublier ma carte'
      } else {
        badge.textContent = 'Brouillon'
        badge.className = 'status-badge status-draft'
        btn.textContent = 'Publier ma carte'
      }
    }

    function showMessage(text, type) {
      const el = document.getElementById('message')
      el.textContent = text
      el.className = 'message ' + type
      setTimeout(() => { el.className = 'message' }, 4000)
    }

    window.saveCard = async function() {
      const full_name = document.getElementById('full_name').value.trim()
      const slug = document.getElementById('slug').value.trim()

      if (!full_name || !slug) {
        showMessage('Nom complet et lien personnalisé sont obligatoires.', 'error')
        return
      }

      const cardData = {
        owner_user_id: currentUser.id,
        full_name,
        job_title: document.getElementById('job_title').value.trim(),
        company_name: document.getElementById('company_name').value.trim(),
        bio: document.getElementById('bio').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        whatsapp: document.getElementById('whatsapp').value.trim(),
        email: document.getElementById('email').value.trim(),
        website: document.getElementById('website').value.trim(),
        address: document.getElementById('address').value.trim(),
        slug
      }

      let result
      if (currentCardId) {
        result = await supabase.from('digital_cards').update(cardData).eq('id', currentCardId).select()
      } else {
        result = await supabase.from('digital_cards').insert(cardData).select()
      }

      if (result.error) {
        showMessage('Erreur : ' + result.error.message, 'error')
        return
      }

      if (!currentCardId && result.data && result.data[0]) {
        currentCardId = result.data[0].id
      }

      updateLinkPreview()
      showMessage('Carte enregistrée !', 'success')
    }

    window.togglePublish = async function() {
      if (!currentCardId) {
        showMessage('Enregistrez d\'abord votre carte.', 'error')
        return
      }

      const { data: current } = await supabase
        .from('digital_cards')
        .select('is_published')
        .eq('id', currentCardId)
        .single()

      const newStatus = !current.is_published

      const { error } = await supabase
        .from('digital_cards')
        .update({ is_published: newStatus })
        .eq('id', currentCardId)

      if (error) {
        showMessage('Erreur : ' + error.message, 'error')
        return
      }

      updatePublishUI(newStatus)
      showMessage(newStatus ? 'Carte publiée !' : 'Carte dépubliée.', 'success')
    }

    window.logout = async function() {
      await supabase.auth.signOut()
      window.location.href = 'index.html'
    }

    init()
  </script>

</body>
</html>
