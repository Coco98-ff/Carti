<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de visite — Carti</title>
<style>
  :root {
    --bg: #0D0D0F;
    --bg-secondary: #1A1A1D;
    --gold: #C9A34D;
    --text: #F5F2EC;
    --text-secondary: #A0A0A5;
    --border: #2A2A2E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
  }
  .photo {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--bg-secondary);
    border: 2px solid var(--gold);
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    color: var(--gold);
    overflow: hidden;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .name {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
  }
  .job {
    text-align: center;
    color: var(--gold);
    font-size: 14px;
    margin-top: 4px;
  }
  .company {
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 2px;
  }
  .bio {
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 16px;
    padding: 0 12px;
    line-height: 1.5;
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 24px;
  }
  .actions a {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
  }
  .actions a.full { grid-column: span 2; }
  .socials {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .socials a {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    text-decoration: none;
  }
  .section-title {
    font-size: 13px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 26px;
    margin-bottom: 10px;
    text-align: center;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .gallery-grid img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .service-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .service-name-block { flex: 1; }
  .service-name { font-size: 14px; font-weight: 600; }
  .service-desc { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4; }
  .service-price-tag {
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
  }
  .review-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .review-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .review-name { font-size: 13px; font-weight: 600; }
  .review-stars { color: var(--gold); font-size: 13px; }
  .review-comment { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
  .review-form {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
  }
  .review-label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  .review-form input, .review-form textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .review-form textarea { min-height: 60px; resize: vertical; }
  .star-picker {
    display: flex;
    gap: 6px;
    font-size: 26px;
    color: var(--border);
    cursor: pointer;
  }
  .star-picker span.active { color: var(--gold); }
  .review-submit-btn {
    width: 100%;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 14px;
    cursor: pointer;
  }
  .review-msg {
    font-size: 12px;
    text-align: center;
    margin-top: 8px;
    display: none;
  }
  .review-msg.success { display: block; color: #3FAE5D; }
  .review-msg.error { display: block; color: #E5484D; }
  .info {
    margin-top: 20px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .info div { margin-bottom: 6px; }
  .info a { color: var(--gold); text-decoration: none; }
  .save-btn {
    display: block;
    width: 100%;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 20px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  .footer {
    text-align: center;
    color: var(--text-secondary);
    font-size: 12px;
    margin-top: 30px;
  }
  .footer a { color: var(--gold); text-decoration: none; }
  .loading, .not-found {
    text-align: center;
    color: var(--text-secondary);
    padding: 60px 20px;
  }
</style>
</head>
<body>

  <div id="loading" class="loading">Chargement...</div>
  <div id="not-found" class="not-found" style="display:none">
    Cette carte n'existe pas ou n'est plus publiée.
  </div>

  <div id="card" class="card" style="display:none">
    <div class="photo" id="photo-box"></div>
    <div class="name" id="c-name"></div>
    <div class="job" id="c-job"></div>
    <div class="company" id="c-company"></div>
    <div class="bio" id="c-bio"></div>

    <div class="actions" id="c-actions"></div>

    <div class="socials" id="c-socials"></div>

    <div id="services-section" style="display:none">
      <div class="section-title">Services</div>
      <div id="services-list"></div>
    </div>

    <div id="reviews-section" style="display:none">
      <div class="section-title">Avis clients</div>
      <div id="reviews-list"></div>
      <div class="review-form">
        <label class="review-label">Votre nom</label>
        <input type="text" id="review-name" placeholder="Votre nom">
        <label class="review-label">Note</label>
        <div class="star-picker" id="star-picker">
          <span data-star="1">★</span><span data-star="2">★</span><span data-star="3">★</span><span data-star="4">★</span><span data-star="5">★</span>
        </div>
        <label class="review-label">Commentaire (optionnel)</label>
        <textarea id="review-comment" placeholder="Votre expérience..."></textarea>
        <button class="review-submit-btn" onclick="submitReview()">Envoyer mon avis</button>
        <div id="review-msg" class="review-msg"></div>
      </div>
    </div>

    <div id="gallery-section" style="display:none">
      <div class="section-title">Galerie</div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>

    <a class="save-btn" id="save-vcf" href="#">⬇️ Enregistrer le contact</a>

    <div class="info" id="c-info"></div>

    <div class="footer">Créé avec <a href="index.html">Carti</a></div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://arjzcloshiqucpyqbotl.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyanpjbG9zaGlxdWNweXFib3RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MjY1NzYsImV4cCI6MjEwMDMwMjU3Nn0.89gB9o1pqIv5G5nwPOpYqz6SrnK38AHTE8Ax7T3-OrE'
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const SOCIAL_ICONS = {
      facebook: '📘',
      linkedin: '💼',
      instagram: '📸',
      tiktok: '🎵',
      youtube: '▶️',
      telegram: '✈️',
      twitter_x: '✖️',
      snapchat: '👻'
    }

    const params = new URLSearchParams(window.location.search)
    const slug = params.get('slug')

    async function loadCard() {
      if (!slug) {
        showNotFound()
        return
      }

      const { data: card, error } = await supabase
        .from('digital_cards')
        .select('*, social_links(*)')
        .eq('slug', slug)
        .eq('is_published', true)
        .single()

      if (error || !card) {
        showNotFound()
        return
      }

      renderCard(card)
      loadGallery(card.id)
      loadServices(card.id)
      loadReviews(card.id)
      logView(card.id)
    }

    function showNotFound() {
      document.getElementById('loading').style.display = 'none'
      document.getElementById('not-found').style.display = 'block'
    }

    function renderCard(card) {
      const photoBox = document.getElementById('photo-box')
      if (card.photo_url) {
        photoBox.innerHTML = '<img src="' + card.photo_url + '" alt="' + (card.full_name || '') + '">'
      } else {
        photoBox.textContent = (card.full_name || '?').charAt(0).toUpperCase()
      }

      document.getElementById('c-name').textContent = card.full_name || ''
      document.getElementById('c-job').textContent = card.job_title || ''
      document.getElementById('c-company').textContent = card.company_name || ''
      document.getElementById('c-bio').textContent = card.bio || ''

      const actions = document.getElementById('c-actions')
      let actionsHtml = ''
      if (card.phone) actionsHtml += `<a href="tel:${card.phone}">📞 Appeler</a>`
      if (card.whatsapp) actionsHtml += `<a href="https://wa.me/${card.whatsapp.replace(/[^0-9]/g,'')}" target="_blank">💬 WhatsApp</a>`
      if (card.email) actionsHtml += `<a href="mailto:${card.email}">✉️ Email</a>`
      if (card.website) actionsHtml += `<a href="${card.website}" target="_blank">🌐 Site web</a>`
      actions.innerHTML = actionsHtml

      const socials = document.getElementById('c-socials')
      let socialsHtml = ''
      if (card.social_links && card.social_links.length > 0) {
        card.social_links.forEach(link => {
          const icon = SOCIAL_ICONS[link.platform] || '🔗'
          socialsHtml += `<a href="${link.url}" target="_blank" title="${link.platform}">${icon}</a>`
        })
      }
      socials.innerHTML = socialsHtml

      const info = document.getElementById('c-info')
      let infoHtml = ''
      if (card.address) infoHtml += `<div>📍 ${card.address}</div>`
      if (card.google_maps_url) infoHtml += `<div><a href="${card.google_maps_url}" target="_blank">Voir sur Google Maps</a></div>`
      info.innerHTML = infoHtml
      if (!infoHtml) info.style.display = 'none'

      document.getElementById('save-vcf').addEventListener('click', (e) => {
        e.preventDefault()
        downloadVCF(card)
      })

      document.getElementById('loading').style.display = 'none'
      document.getElementById('card').style.display = 'block'
    }

    async function loadGallery(cardId) {
      const { data: items } = await supabase
        .from('gallery')
        .select('*')
        .eq('card_id', cardId)
        .order('display_order', { ascending: true })

      if (items && items.length > 0) {
        const grid = document.getElementById('gallery-grid')
        grid.innerHTML = items.map(item => `<img src="${item.media_url}" alt="">`).join('')
        document.getElementById('gallery-section').style.display = 'block'
      }
    }

    async function loadServices(cardId) {
      const { data: items } = await supabase
        .from('services')
        .select('*')
        .eq('card_id', cardId)
        .order('display_order', { ascending: true })

      if (items && items.length > 0) {
        const list = document.getElementById('services-list')
        list.innerHTML = items.map(item => `
          <div class="service-card">
            <div class="service-name-block">
              <div class="service-name">${item.title}</div>
              ${item.description ? '<div class="service-desc">' + item.description + '</div>' : ''}
            </div>
            ${item.price ? '<div class="service-price-tag">' + item.price + ' ' + item.currency + '</div>' : ''}
          </div>
        `).join('')
        document.getElementById('services-section').style.display = 'block'
      }
    }

    let currentCardIdForReview = null
    let selectedRating = 0

    async function loadReviews(cardId) {
      currentCardIdForReview = cardId

      const { data: items } = await supabase
        .from('reviews')
        .select('*')
        .eq('card_id', cardId)
        .eq('is_published', true)
        .order('created_at', { ascending: false })

      const list = document.getElementById('reviews-list')
      list.innerHTML = (items || []).map(item => `
        <div class="review-card">
          <div class="review-header">
            <div class="review-name">${item.visitor_name}</div>
            <div class="review-stars">${'★'.repeat(item.rating)}${'☆'.repeat(5 - item.rating)}</div>
          </div>
          ${item.comment ? '<div class="review-comment">' + item.comment + '</div>' : ''}
        </div>
      `).join('')

      document.getElementById('reviews-section').style.display = 'block'

      const stars = document.querySelectorAll('#star-picker span')
      stars.forEach(star => {
        star.addEventListener('click', () => {
          selectedRating = parseInt(star.getAttribute('data-star'))
          stars.forEach(s => {
            s.classList.toggle('active', parseInt(s.getAttribute('data-star')) <= selectedRating)
          })
        })
      })
    }

    window.submitReview = async function() {
      const name = document.getElementById('review-name').value.trim()
      const comment = document.getElementById('review-comment').value.trim()
      const msgEl = document.getElementById('review-msg')

      if (!name || selectedRating === 0) {
        msgEl.textContent = 'Merci de renseigner votre nom et une note.'
        msgEl.className = 'review-msg error'
        return
      }

      const { error } = await supabase.from('reviews').insert({
        card_id: currentCardIdForReview,
        visitor_name: name,
        rating: selectedRating,
        comment
      })

      if (error) {
        msgEl.textContent = 'Erreur : ' + error.message
        msgEl.className = 'review-msg error'
        return
      }

      msgEl.textContent = 'Merci pour votre avis !'
      msgEl.className = 'review-msg success'
      document.getElementById('review-name').value = ''
      document.getElementById('review-comment').value = ''
      selectedRating = 0
      document.querySelectorAll('#star-picker span').forEach(s => s.classList.remove('active'))
      loadReviews(currentCardIdForReview)
    }

    function downloadVCF(card) {
      let vcf = 'BEGIN:VCARD\nVERSION:3.0\n'
      vcf += `FN:${card.full_name}\n`
      if (card.company_name) vcf += `ORG:${card.company_name}\n`
      if (card.job_title) vcf += `TITLE:${card.job_title}\n`
      if (card.phone) vcf += `TEL;TYPE=CELL:${card.phone}\n`
      if (card.email) vcf += `EMAIL:${card.email}\n`
      if (card.website) vcf += `URL:${card.website}\n`
      if (card.address) vcf += `ADR:;;${card.address};;;;\n`
      vcf += 'END:VCARD'

      const blob = new Blob([vcf], { type: 'text/vcard' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = card.full_name.replace(/\s+/g,'_') + '.vcf'
      a.click()
      URL.revokeObjectURL(url)

      supabase.from('vcard_exports').insert({ card_id: card.id }).then(() => {})
    }

    function logView(cardId) {
      supabase.from('analytics').insert({
        card_id: cardId,
        event_type: 'view',
        device_type: /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop'
      }).then(() => {})
    }

    loadCard()
  </script>

</body>
</html>
